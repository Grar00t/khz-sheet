name: Desktop Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build native core and desktop app
        shell: pwsh
        run: ./build-desktop.ps1

      - name: Managed integration tests against Windows DLL
        shell: pwsh
        run: |
          $NativeDll = Get-ChildItem -Path "build\desktop-native" -Recurse -Filter "khz_sheet.dll" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $NativeDll) {
            throw "khz_sheet.dll was not produced by the desktop native build."
          }

          $env:PATH = "$($NativeDll.DirectoryName);$env:PATH"

          dotnet run --project tests/dotnet/KhzExactLiteral/KhzExactLiteral.csproj -c Release
          dotnet run --project tests/dotnet/KhzFormulaCells/KhzFormulaCells.csproj -c Release
