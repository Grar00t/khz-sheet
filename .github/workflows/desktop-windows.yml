name: Desktop Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Native tests on Windows
        shell: pwsh
        run: |
          $env:CFLAGS = "/std:c11 /experimental:c11atomics"
          cmake -S . -B build/windows-tests `
            -DKHZ_ENABLE_LEDGER=OFF `
            -DKHZ_BUILD_SELFTEST=ON `
            -DKHZ_BUILD_TESTS=ON `
            -DKHZ_BUILD_SHARED=OFF
          cmake --build build/windows-tests --config Release --parallel
          ctest --test-dir build/windows-tests -C Release --output-on-failure

      - name: Build native core and desktop app
        shell: pwsh
        run: ./build-desktop.ps1

      - name: Managed integration tests against Windows DLL
        shell: pwsh
        run: |
          $NativeDll = Get-ChildItem -Path "build\desktop-native" -Recurse -Filter "khz_sheet.dll" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $NativeDll) {
            throw "khz_sheet.dll was not produced by the desktop native build."
          }

          $env:PATH = "$($NativeDll.DirectoryName);$env:PATH"

          dotnet run --project tests/dotnet/KhzExactLiteral/KhzExactLiteral.csproj -c Release
          dotnet run --project tests/dotnet/KhzFormulaCells/KhzFormulaCells.csproj -c Release
          dotnet run --project tests/dotnet/KhzOpcPackage/KhzOpcPackage.csproj -c Release
