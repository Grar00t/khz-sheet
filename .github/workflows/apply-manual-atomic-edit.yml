name: Apply manually authored atomic-edit patch

on:
  push:
    branches: [manual/khz-sheet-local-private]
    paths:
      - manual-atomic-edit.patch
      - .github/workflows/apply-manual-atomic-edit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manual/khz-sheet-local-private
          fetch-depth: 0
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test -f manual-atomic-edit.patch
          git apply --check manual-atomic-edit.patch
          git apply manual-atomic-edit.patch
          rm manual-atomic-edit.patch
          rm .github/workflows/apply-manual-atomic-edit.yml
          git config user.name 'khz-sheet automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement atomic multi-cell spreadsheet edits'
          git push origin HEAD:manual/khz-sheet-local-private
